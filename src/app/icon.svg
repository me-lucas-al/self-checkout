<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="primaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGold)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Self-Checkout Totem Screen / Restaurant Icon -->
  <g filter="url(#shadow)" transform="translate(48, 48)">
    <!-- Totem Kiosk Frame -->
    <rect x="72" y="32" width="272" height="352" rx="36" fill="#27272A" stroke="url(#primaryGold)" stroke-width="8" />
    
    <!-- Screen area -->
    <rect x="96" y="56" width="224" height="256" rx="20" fill="#18181B" />

    <!-- Restaurant Cloche & Utensils Icon on Screen -->
    <!-- Cloche dome -->
    <path d="M 148 190 C 148 140 268 140 268 190 Z" fill="url(#primaryGold)" />
    <!-- Cloche handle -->
    <circle cx="208" cy="132" r="10" fill="url(#accentGrad)" />
    <!-- Cloche plate base -->
    <rect x="136" y="194" width="144" height="12" rx="6" fill="url(#primaryGold)" />

    <!-- Sparkles / Touch indicator -->
    <path d="M 272 108 L 278 122 L 292 128 L 278 134 L 272 148 L 266 134 L 252 128 L 266 122 Z" fill="#FDE68A" />
    <circle cx="136" cy="100" r="4" fill="#FDE68A" />

    <!-- Card / Checkout Slot at bottom of totem -->
    <rect x="160" y="336" width="96" height="10" rx="5" fill="url(#accentGrad)" />
    <circle cx="208" cy="362" r="6" fill="#71717A" />
  </g>
</svg>
