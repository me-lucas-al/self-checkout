<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51821" />
      <stop offset="100%" stop-color="#BA0C14" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE59" />
      <stop offset="100%" stop-color="#FFBC0D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Subtle glow / border overlay -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15" />

  <!-- Iconic McDonald's Golden Arches -->
  <g filter="url(#shadow)" fill="url(#goldGradient)">
    <!-- Left Arch & Right Arch M -->
    <path d="M 125 385 C 125 385 125 240 160 170 C 185 120 230 115 256 220 C 282 115 327 120 352 170 C 387 240 387 385 387 385 C 387 385 362 385 345 385 C 345 385 345 255 325 205 C 310 165 285 170 270 245 C 265 270 265 385 265 385 C 265 385 247 385 247 385 C 247 385 247 270 242 245 C 227 170 202 165 187 205 C 167 255 167 385 167 385 Z" />
  </g>

  <!-- Mini Self-Checkout / Touch Totem indicator badge at bottom right -->
  <g transform="translate(340, 340)">
    <circle cx="35" cy="35" r="48" fill="#18181B" stroke="#FFBC0D" stroke-width="6" filter="url(#shadow)" />
    <!-- Touch / Sparkle / Cart Icon -->
    <path d="M 23 20 L 47 20 L 41 38 L 29 38 Z" fill="#FFBC0D" />
    <circle cx="31" cy="46" r="3.5" fill="#FFFFFF" />
    <circle cx="39" cy="46" r="3.5" fill="#FFFFFF" />
    <!-- Screen lines / tap spark -->
    <path d="M 35 11 L 35 15" stroke="#FFDE59" stroke-width="3" stroke-linecap="round" />
    <path d="M 23 15 L 26 18" stroke="#FFDE59" stroke-width="3" stroke-linecap="round" />
    <path d="M 47 15 L 44 18" stroke="#FFDE59" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
