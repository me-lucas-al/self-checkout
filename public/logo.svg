<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(6, 6)">
    <rect width="68" height="68" rx="18" fill="url(#logoBgGrad)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.5" filter="url(#logoShadow)" />
    <!-- Utensils Crossed -->
    <g transform="translate(14, 14) scale(1.65)" stroke="url(#amberGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
      <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
      <path d="m2.1 21.8 6.4-6.3" />
      <path d="m19 5-7 7" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 20)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#18181B" letter-spacing="-0.5">Self Checkout</text>
    <rect x="0" y="32" width="102" height="18" rx="5" fill="#FEF3C7" />
    <text x="6" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#D97706" letter-spacing="0.5">TOTEM DIGITAL</text>
    <circle cx="112" cy="41" r="3" fill="#16A34A" />
    <text x="120" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#16A34A">ONLINE</text>
  </g>
